<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Center Pro | Celestial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root {
            --background: #0D0F1B;
            --surface: #131524;
            --primary: #8A2BE2;
            --secondary: #4A00E0;
            --accent: #00BFFF;
            --text-primary: #E0E0E0;
            --text-secondary: #A0A0A0;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body { 
            font-family: 'Inter', sans-serif;
            background-color: var(--background);
            color: var(--text-primary);
        }

        /* Animated Gradient Background */
        .background-gradient {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            background: linear-gradient(245deg, var(--primary), var(--secondary), var(--background), #0a041f);
            background-size: 400% 400%;
            animation: gradient-animation 25s ease infinite;
        }
        @keyframes gradient-animation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Celestial Card Style */
        .celestial-card {
            background-color: rgba(19, 21, 36, 0.6); /* --surface with opacity */
            backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid var(--border-color);
            border-radius: 1.25rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .celestial-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5), 0 0 20px 0 var(--accent);
        }

        /* Aurora Effect inside Cards */
        .celestial-card::before {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            z-index: 0;
            background: radial-gradient(circle at 100% 0%, var(--accent), transparent 30%),
                        radial-gradient(circle at 0% 100%, var(--primary), transparent 40%);
            opacity: 0.15;
            transition: opacity 0.5s ease;
        }
        .celestial-card:hover::before {
            opacity: 0.3;
        }
        .celestial-card > * {
            position: relative;
            z-index: 1;
        }

        /* Buttons */
        .celestial-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            font-weight: 600;
            color: white;
            border: 1px solid transparent;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px 0 rgba(0, 0, 0, 0.2);
        }
        .btn-primary {
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }
        .btn-primary:hover {
            box-shadow: 0 0 20px 0 var(--primary);
            transform: scale(1.05);
        }
        .btn-secondary {
             background: linear-gradient(90deg, var(--accent), #0077b3);
        }
        .btn-secondary:hover {
             box-shadow: 0 0 20px 0 var(--accent);
             transform: scale(1.05);
        }

        /* Inputs */
        .celestial-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .celestial-input::placeholder { color: var(--text-secondary); }
        .celestial-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 10px 0 var(--accent);
        }

        /* Animations */
        .page { animation: fadeIn 0.6s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Custom Scrollbar for Admin/About pages */
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: var(--accent);
            border-radius: 10px;
            border: 2px solid var(--surface);
        }

        /* Loader */
        .loader {
            width: 56px; height: 56px;
            border: 5px solid var(--border-color);
            border-bottom-color: var(--accent);
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }
        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Logo Slider */
        .logo-slider { width: 100%; overflow: hidden; white-space: nowrap; -webkit-mask: linear-gradient(90deg, transparent, white 20%, white 80%, transparent); mask: linear-gradient(90deg, transparent, white 20%, white 80%, transparent); }
        .logo-slider-inner { display: inline-block; animation: slide-logos 30s linear infinite; }
        .logo-slider img { height: 40px; margin: 0 2rem; filter: grayscale(1) brightness(2); transition: filter 0.3s; display: inline-block; }
        .logo-slider img:hover { filter: grayscale(0) brightness(1); }
        @keyframes slide-logos { from { transform: translateX(0); } to { transform: translateX(-50%); } }

    </style>
</head>
<body class="light">

    <div class="background-gradient"></div>

    <div id="login-page" class="min-h-screen flex items-center justify-center p-4 page">
        <div class="celestial-card p-8 max-w-sm w-full text-white">
            <div class="text-center mb-8">
                <i data-lucide="orbit" class="w-16 h-16 mx-auto text-accent mb-2"></i>
                <h1 class="text-3xl font-bold text-center drop-shadow-md">Task Center Pro</h1>
                <p class="text-text-secondary mt-1">Celestial Edition</p>
            </div>
            <form id="auth-form" class="space-y-4">
                <input type="email" id="email" placeholder="Email Address" required class="celestial-input">
                <input type="password" id="password" placeholder="Password" required class="celestial-input">
                <input type="text" id="invite-code" placeholder="Invitation Code (for signup)" class="celestial-input">
                <div class="flex space-x-4 pt-4">
                    <button type="button" id="login-btn" class="celestial-btn btn-primary w-full"><i data-lucide="log-in"></i><span>Login</span></button>
                    <button type="button" id="signup-btn" class="celestial-btn btn-secondary w-full"><i data-lucide="user-plus"></i><span>Sign Up</span></button>
                </div>
            </form>
            <p id="message" class="text-center mt-4 text-white drop-shadow-md h-5"></p>
        </div>
    </div>

    <div id="main-menu-page" class="hidden min-h-screen flex flex-col items-center justify-center p-4 relative z-10 page">
        <nav class="absolute top-6 right-6 flex items-center space-x-4">
             <a href="#" id="nav-admin" class="hidden bg-surface/80 backdrop-blur-sm text-white py-2 px-4 rounded-full hover:text-accent transition-colors shadow-md flex items-center gap-2"><i data-lucide="shield"></i>Admin</a>
             <a href="#" id="nav-support" class="bg-surface/80 backdrop-blur-sm text-white py-2 px-4 rounded-full hover:text-accent transition-colors shadow-md flex items-center gap-2"><i data-lucide="life-buoy"></i>Support</a>
             <button id="sign-out-btn" class="bg-red-500/80 text-white py-2 px-4 rounded-full hover:bg-red-600/80 transition-colors shadow-md flex items-center gap-2"><i data-lucide="log-out"></i>Sign Out</button>
        </nav>
        <div class="celestial-card rounded-2xl p-8 max-w-3xl w-full text-center flex flex-col items-center justify-center min-h-[550px]">
            <i data-lucide="rocket" class="w-20 h-20 text-accent mb-4"></i>
            <h1 class="text-4xl font-bold mb-4 text-white drop-shadow-md">Professional Task Center</h1>
            <p class="text-lg text-text-secondary mb-8 drop-shadow-md max-w-md">Your gateway to a seamless digital experience. Earn rewards by completing simple tasks from leading brands.</p>
            <div class="flex-grow flex items-center justify-center w-full my-8">
                <div class="logo-slider">
                    <div class="logo-slider-inner">
                        <img src="https://www.webmaxy.co/blog/wp-content/uploads/2025/03/Everything-About-Meta-Business-Partners.webp" alt="Meta Logo"><img src="https://cdn.sanity.io/images/8r84dcl1/portfolio/d13c28990a3f172305676b7ca57f2a5140e8331d-823x350.jpg?rect=151,0,523,350&w=578&h=387" alt="Brand Logo 2"><img src="https://www.adsmurai.com/hubfs/Header_Press%20%281%29.png" alt="Ads Murai Logo"><img src="https://images.ctfassets.net/gogvzi849aaj/2WUs1ZWrSgI0G499ZtC8wD/21032d843d047afd534c06422c400932/PowerPartner_Toolkit_2024_LIFBTW.png" alt="Power Partner Logo"><img src="https://www.webmaxy.co/blog/wp-content/uploads/2025/03/Everything-About-Meta-Business-Partners.webp" alt="Meta Logo"><img src="https://cdn.sanity.io/images/8r84dcl1/portfolio/d13c28990a3f172305676b7ca57f2a5140e8331d-823x350.jpg?rect=151,0,523,350&w=578&h=387" alt="Brand Logo 2"><img src="https://www.adsmurai.com/hubfs/Header_Press%20%281%29.png" alt="Ads Murai Logo"><img src="https://images.ctfassets.net/gogvzi849aaj/2WUs1ZWrSgI0G499ZtC8wD/21032d843d047afd534c06422c400932/PowerPartner_Toolkit_2024_LIFBTW.png" alt="Power Partner Logo">
                    </div>
                </div>
            </div>
            <div class="flex space-x-4 mt-auto">
                <button id="about-btn" class="celestial-btn btn-primary"><i data-lucide="info"></i><span>About Us</span></button>
                <button id="start-btn" class="celestial-btn btn-secondary"><i data-lucide="play-circle"></i><span>Start Tasks</span></button>
                <button id="account-btn" class="celestial-btn btn-primary"><i data-lucide="user"></i><span>Account</span></button>
            </div>
        </div>
    </div>
    
    <div id="tasks-page" class="hidden min-h-screen p-4 md:p-8 relative z-10 page">
        <nav class="flex justify-between items-center py-4">
            <h1 class="text-3xl font-bold text-white drop-shadow-md flex items-center gap-3"><i data-lucide="list-checks"></i>Your Tasks</h1>
            <div class="flex space-x-4">
                <button id="refresh-tasks-btn" class="celestial-btn btn-secondary"><i data-lucide="refresh-cw"></i>Refresh</button>
                <button id="nav-back-tasks" class="celestial-btn btn-primary"><i data-lucide="arrow-left"></i>Back</button>
            </div>
        </nav>
        <div class="mt-4 p-4 rounded-xl bg-surface/80 backdrop-blur-sm text-white text-center shadow-lg flex justify-around items-center border border-border-color">
            <h2 class="text-2xl font-bold drop-shadow-md">Balance: $<span id="balance-amount">0.00</span></h2>
            <h3 id="task-counter" class="text-xl font-semibold drop-shadow-md"></h3>
        </div>
        <div id="task-container" class="mt-8 flex justify-center"></div>
        <div id="loader" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50">
            <div class="celestial-card p-8 rounded-lg text-center text-white"><div class="loader mx-auto"></div><p id="loader-message" class="mt-4 text-xl font-semibold">Submitting Task...</p></div>
        </div>
    </div>
    
    <div id="message-modal" class="hidden fixed inset-0 bg-black bg-opacity-70 backdrop-blur-sm flex items-center justify-center z-50 page">
        <div class="celestial-card p-6 rounded-xl shadow-2xl w-full max-w-sm text-white">
            <h3 id="modal-title" class="text-lg font-bold mb-2 flex items-center gap-2"></h3>
            <p id="modal-message" class="text-text-secondary"></p>
            <div class="flex justify-end mt-4">
                <button id="modal-close-btn" class="celestial-btn btn-primary">OK</button>
            </div>
        </div>
    </div>

    <script type="module">
        // --- Your existing Supabase JavaScript logic goes here ---
        // It should work with the new class names without changes, as IDs are the same.
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        // Supabase configuration
        const supabaseUrl = 'https://cnujrntwyqfsenlbuuha.supabase.co';
        const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNudWpybnR3eXFmc2VubGJ1dWhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY1OTAwMzIsImV4cCI6MjA3MjE2NjAzMn0.t85E96ComoUCDlEexYXYFwq-OGxtwXNehUJTZ6eyZ74';
        const supabase = createClient(supabaseUrl, supabaseAnonKey);

        // --- Global State & Navigation ---
        const pageElements = { login: document.getElementById('login-page'), 'main-menu': document.getElementById('main-menu-page'), about: document.getElementById('about-page'), tasks: document.getElementById('tasks-page'), account: document.getElementById('account-page'), admin: document.getElementById('admin-page'), support: document.getElementById('support-page'),};
        let allTasks = []; let currentTaskIndex = 0;
        let totalTasksInSetCount = 0;
        function showPage(pageName) { Object.values(pageElements).forEach(el => el.classList.add('hidden')); if (pageElements[pageName]) pageElements[pageName].classList.remove('hidden'); }
        
        function showModal(title, message, isSuccess = true) {
            const titleEl = document.getElementById('modal-title');
            const icon = isSuccess ? `<i data-lucide="check-circle" class="text-green-400"></i>` : `<i data-lucide="x-circle" class="text-red-400"></i>`;
            titleEl.innerHTML = `${icon} ${title}`;
            document.getElementById('modal-message').textContent = message;
            document.getElementById('message-modal').classList.remove('hidden');
            lucide.createIcons();
        }
        document.getElementById('modal-close-btn').addEventListener('click', () => document.getElementById('message-modal').classList.add('hidden'));

        // --- Auth Logic ---
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const inviteCodeInput = document.getElementById('invite-code');
        const messageEl = document.getElementById('message');
        
        async function handleLogin() {
            messageEl.textContent = 'Logging in...';
            const { error } = await supabase.auth.signInWithPassword({ email: emailInput.value, password: passwordInput.value });
            if (error) { messageEl.textContent = error.message; }
        }
        async function handleSignup() {
            messageEl.textContent = '';
            if (!emailInput.value || !passwordInput.value || !inviteCodeInput.value) { messageEl.textContent = 'Please fill out all fields.'; return; }
            const { data: codeData, error: codeError } = await supabase.from('invitation_codes').select('*').eq('code', inviteCodeInput.value).eq('is_used', false).single();
            if (codeError || !codeData) { messageEl.textContent = 'Invalid or used invitation code.'; return; }
            const { data, error } = await supabase.auth.signUp({ email: emailInput.value, password: passwordInput.value });
            if (error) { messageEl.textContent = error.message; } 
            else {
                await supabase.from('invitation_codes').update({ is_used: true, used_by: data.user.id }).eq('id', codeData.id);
                await supabase.from('users').insert([{ id: data.user.id, email: data.user.email, balance: 10.00, role: 'user' }]);
                showModal('Success', 'Sign up successful! Please check your email for a confirmation link.');
            }
        }
        async function handleSignOut() { await supabase.auth.signOut(); showPage('login'); }
        
        // --- User-Facing Task Logic ---
        const navAdminLink = document.getElementById('nav-admin');
        const balanceEl = document.getElementById('balance-amount');

        async function fetchUserData() {
            const { data: { user } } = await supabase.auth.getUser();
            if (user) {
                const { data, error } = await supabase.from('users').select('balance, role').eq('id', user.id).single();
                if (error) { console.error('Error fetching user data:', error); return; }
                if (data) {
                    balanceEl.textContent = parseFloat(data.balance).toFixed(2);
                    if(document.getElementById('account-balance')) document.getElementById('account-balance').textContent = parseFloat(data.balance).toFixed(2);
                    const userRole = data.role ? data.role.trim().toLowerCase() : '';
                    navAdminLink.classList.toggle('hidden', userRole !== 'admin');
                }
            } else { showPage('login'); }
        }

        async function loadAllTasks() {
            // ... Your existing loadAllTasks function ...
            // The displayNextTask part needs a slight update for the new card style
        }
        
        function displayNextTask() {
            const taskContainer = document.getElementById('task-container');
            const completedCount = totalTasksInSetCount - allTasks.length;

            if (allTasks.length === 0 || currentTaskIndex >= allTasks.length) {
                taskContainer.innerHTML = `<div class="celestial-card p-8 text-center"><i data-lucide="party-popper" class="w-16 h-16 mx-auto text-accent mb-4"></i><h3 class="text-2xl font-bold">All Tasks Completed!</h3><p class="text-text-secondary mt-2">Well done! You've completed all tasks in your set.</p></div>`;
                document.getElementById('task-counter').textContent = totalTasksInSetCount > 0 ? `Progress: ${totalTasksInSetCount} / ${totalTasksInSetCount}` : `All Complete!`;
                lucide.createIcons();
                return;
            }

            document.getElementById('task-counter').textContent = `Progress: ${completedCount + currentTaskIndex + 1} / ${totalTasksInSetCount}`;
            const task = allTasks[currentTaskIndex];
            taskContainer.innerHTML = `<div class="celestial-card p-6 flex flex-col items-center text-center max-w-sm w-full">
                <img src="${task.image_url}" alt="Task" class="w-32 h-32 object-cover rounded-full mb-4 shadow-xl border-4 border-surface">
                <h3 class="text-xl font-semibold text-white">${task.title}</h3>
                <div class="my-4 text-center">
                    <p class="text-text-secondary">Earn: <span class="font-bold text-green-400">$${parseFloat(task.earned).toFixed(2)}</span></p>
                    <p class="text-text-secondary">Cost: <span class="font-bold text-red-400">$${parseFloat(task.price).toFixed(2)}</span></p>
                </div>
                <button class="submit-task-btn celestial-btn btn-secondary w-full" data-task-id="${task.id}" data-price="${task.price}" data-earned="${task.earned}"><i data-lucide="check"></i>Submit</button>
            </div>`;
            taskContainer.querySelector('.submit-task-btn').addEventListener('click', handleSubmitTask);
            lucide.createIcons();
        }

        async function handleSubmitTask(e) {
            // ... This function remains the same
        }

        // --- All other JavaScript functions (Account, Admin, etc.) remain the same ---
        // I have omitted them here for brevity but you should paste your existing JS logic back in.
        
        // --- Event Listeners ---
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            // Auth & Main Nav
            document.getElementById('login-btn').addEventListener('click', handleLogin);
            document.getElementById('signup-btn').addEventListener('click', handleSignup);
            document.getElementById('sign-out-btn').addEventListener('click', handleSignOut);
            document.getElementById('about-btn').addEventListener('click', () => showPage('about'));
            document.getElementById('start-btn').addEventListener('click', () => { showPage('tasks'); loadAllTasks(); });
            document.getElementById('refresh-tasks-btn').addEventListener('click', loadAllTasks);
            document.getElementById('account-btn').addEventListener('click', () => { showPage('account'); /* call displayAccountInfo */ });
            document.getElementById('nav-admin').addEventListener('click', () => { showPage('admin'); /* call refreshAdminDashboard */ });
            document.getElementById('nav-support').addEventListener('click', () => showPage('support'));
            ['about', 'tasks', 'account', 'admin', 'support'].forEach(p => {
                const navBackBtn = document.getElementById(`nav-back-${p}`);
                if (navBackBtn) navBackBtn.addEventListener('click', () => showPage('main-menu'));
            });
            
            // ... Paste your other event listeners for Account and Admin pages here ...
            
            supabase.auth.onAuthStateChange((event, session) => {
                if (session) { showPage('main-menu'); fetchUserData(); } 
                else { showPage('login'); }
            });
        });
    </script>
</body>
</html>
